[package]
name = "agent-id"
version = "0.1.0"
edition = "2021"
description = "Portable identity registry for coding-agent sessions"
license = "MIT"

[[bin]]
name = "agent-id"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.0"
